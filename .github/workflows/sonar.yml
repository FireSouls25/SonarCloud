name: Quality Gate - SonarCloud
on:
 push:
  branches["main"]
job:
 sonarcloud:
  name: Analisis SonarCloud
  runs-on: ubuntu-latest
  steps:
   - name: Checkout del codigo
   users: actions/checkout@v3
   with:
    fetch-depth: 0
   - name: Analisis
     users: SonarCloud/sonarcloud github actions@main
     env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
     with:
      args:
       - Dsonar.organization = FireSouls25
       - Dsonar.projectKey=FireSouls25_SonarCloud
